<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Ateliers AR</title>

  <style>
    :root {
      --bg:     #1C1E22;
      --text:   #DDDBD6;
      --muted:  #999;
      --border: #2E3138;
      --accent: #5BC8C0;
      --font:      system-ui, sans-serif;
      --font-mono: ui-monospace, monospace;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      min-height:100dvh; padding:40px 16px;
      background:var(--bg); color:var(--text); font-family:var(--font);
    }
    main { max-width:640px; margin:0 auto; }
    h1 { font-size:24px; font-weight:500; margin-bottom:28px; }
    ul { list-style:none; border-top:0.5px solid var(--border); }
    li { border-bottom:0.5px solid var(--border); }
    a {
      display:flex; flex-direction:column; gap:4px; padding:16px 0;
      color:inherit; text-decoration:none;
    }
    a:hover .title, a:active .title { color:var(--accent); }
    .title { font-size:17px; font-weight:500; transition:color 0.2s; }
    .client { font-family:var(--font-mono); font-size:12px; color:var(--muted); }
    .date { font-family:var(--font-mono); font-size:12px; color:var(--accent); }
    .date::first-letter { text-transform:uppercase; }
    .empty { padding:16px 0; color:var(--muted); }
  </style>
</head>

<body>
<main>
  <h1>Ateliers AR</h1>
  <ul>
    <!-- ATELIERS: replaced by .claude/skills/deploy/build-home.mjs -->
  </ul>
</main>
</body>

</html>
